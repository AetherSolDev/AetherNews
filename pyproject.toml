# Path: pyproject.toml
# Purpose: Project metadata and entry point for pip-installable aethernews command.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aethernews"
version = "0.1.0"
description = "Terminal RSS News Reader — subscribe to feeds, read articles in your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["news", "rss", "tui", "terminal", "textual", "reader", "atom"]
classifiers = [
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "feedparser>=6.0,<7.0",
    "textual>=0.41,<2.0",
    "aiohttp>=3.9,<4.0",
    "platformdirs>=3.0",
]

[project.scripts]
aethernews = "aethernews.cli:main"

[tool.setuptools.packages.find]
include = ["aethernews*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
